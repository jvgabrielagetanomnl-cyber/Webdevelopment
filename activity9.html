<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        html {
            scroll-behavior: smooth;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #e0f2fe, #f4f4f4);
            color:#131111;
            line-height:1.6;
        }

        header{
            background:#3f5180;
            color:white;
            text-align:center;
            padding:50px 20px;
        }

        header h1{
            font-size:42px;
        }

        header p{
            font-size:18px;
            margin-top:10px;
        }

        nav{
            background:#0f172a;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        nav a:hover{
            color:#38bdf8;
        }

        section{
            max-width:900px;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 10px rgba(0,0,0,.1);
        }

        h2{
            color:#1e3a8a;
            margin-bottom:15px;
        }

        .skills{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .skill{
            background:#1e3a8a;
            color:white;
            padding:8px 15px;
            border-radius:20px;
        }

        /* ---------- Redesigned Projects Section ---------- */
        #projects .section-sub{
            color:#666;
            margin-bottom:26px;
            font-size:15px;
        }

        .project-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
            gap:20px;
        }

        .project-card{
            background:#f4f6fb;
            border:1px solid #e2e6f0;
            border-radius:10px;
            padding:22px;
            transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }

        .project-card:hover{
            transform:translateY(-4px);
            box-shadow:0 8px 16px rgba(30,58,138,.15);
            border-color:#1e3a8a;
        }

        .project-tag{
            display:inline-block;
            background:#1e3a8a;
            color:white;
            font-size:11px;
            font-weight:bold;
            text-transform:uppercase;
            letter-spacing:.05em;
            padding:4px 10px;
            border-radius:20px;
            margin-bottom:12px;
        }

        .project-card h3{
            color:#1e3a8a;
            margin-bottom:8px;
            font-size:18px;
        }

        .project-card p{
            font-size:14px;
            color:#555;
        }

        /* ---------- Redesigned Contact Section ---------- */
        #contact{
            text-align:center;
        }

        #contact h2{
            margin-bottom:8px;
        }

        #contact .contact-sub{
            color:#666;
            margin-bottom:30px;
            font-size:15px;
        }

        .contact-cards{
            display:flex;
            flex-wrap:wrap;
            gap:16px;
            justify-content:center;
        }

        .contact-card{
            flex:1 1 220px;
            max-width:260px;
            background:#f4f6fb;
            border:1px solid #e2e6f0;
            border-radius:10px;
            padding:22px 18px;
            text-align:center;
            text-decoration:none;
            color:#333;
            transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }

        .contact-card:hover{
            transform:translateY(-4px);
            box-shadow:0 8px 16px rgba(30,58,138,.15);
            border-color:#1e3a8a;
        }

        .contact-icon{
            width:46px;
            height:46px;
            margin:0 auto 12px;
            border-radius:50%;
            background:#1e3a8a;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
        }

        .contact-card .label{
            font-weight:bold;
            color:#1e3a8a;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:.05em;
            margin-bottom:4px;
        }

        .contact-card .value{
            font-size:14px;
            color:#555;
            word-break:break-word;
        }

        footer{
            background:#0f172a;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        @media(max-width:768px){
            header h1{
                font-size:30px;
            }

            nav a{
                display:block;
                margin:10px;
            }
        }
    </style>
</head>

<body>
<header>
    <form action="save.html" method="post" target="_blank">
        <h1>Student Information Profile</h1>
        <p>Senior highschool Enrollment - Grade 11</p>
    </header>
        <fieldset>
            <legend>Personal Information</legend>
    <section id="about">
       <label>First Name</label>
        <input type="text" name="firstname" required><br>
        <label>Last Name</label>
            <input type="text" name="lastname" required><br>
        <label>middle initial</label>
            <input type="text" name="middle_initial" required><br>
        <label>Email Address</label>
            <input type="email" name="email" required><br>
        <label>Password</label>
            <input type="password" name="password" required><br>
        <label>Age</label>
            <input type="number" name="age" required><br>
        <label>Birthday</label>
            <input type="date" name="birthday" required><br>
        <label>Contact Number</label>
            <input type="number" name="contact_number" required><br>
    </div>
</section>
        </fieldset>

<section id="education">
    <fieldset>
        <legend>Student Information</legend>
    <label>Student ID</label>
    <input type="text" name="student_id" required><br>
    <label>Grade level</label>
    <select name="grade_level" required>
        <option value="">Select Grade Level</option>
        <option value="grade_11">Grade 11</option>
        <option value="grade_12">Grade 12</option>
    </select>
    <label>Strand</label>
    <select name="strand" required>
        <option value="">Select Strand</option>
        <option value="stem">STEM</option>
        <option value="humss">CPNT</option>
        <option value="abm">ABM</option>
    </select>
    </fieldset>
</section>

<section id="projects">
    <fieldset>
        <legend>Additional Information</legend>
    <label>Gender</label>
     <select name="strand" required>
        <option value="">Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="rathernotsay">Rather not say</option>
    </select>
    <label>Hobbies</label>
        <input type="checkbox">Coding<br>
        <input type="checkbox">Gaming<br>
        <input type="checkbox">Reading<br>
        <input type="checkbox">Watching Movies<br>
        <input type="checkbox">Watching Sports<br>


        <textarea name="complete_address" rows="4" cols="50" required>
 Complete Address
        </textarea><br>

        <label>Document</label>
        <input type="file" name="file"><br>

    </fieldset>
</section>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">




</form>
</body>
</html>
